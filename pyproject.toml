[build-system]
# >= 61: configuration in "pyproject.toml"
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"


[project]
name            = "pyinvoice"
description     = "cli script to generate PDF invoices from custom XML files"
readme          = "README.md"
license         = {text = "MIT"}
# only Python 3.10+ are actually tested
requires-python = ">= 3.8"
dynamic         = ["version"]

authors = [
    {name = "Felix Schwarz", email = "felix.schwarz@oss.schwarz.eu"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "babel",
    "docopt-ng",
    "jinja2",
    "lxml",
    "packaging",
]

[project.optional-dependencies]
testing = [
    "pytest",
]

[project.urls]
Homepage        = "https://github.com/FelixSchwarz/pyinvoice"
Code            = "https://github.com/FelixSchwarz/pyinvoice"
"Issue tracker" = "https://github.com/FelixSchwarz/pyinvoice/issues"

[project.scripts]
pyinvoice = "schwarz.pyinvoice.cli:cli_main"


[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}

[tool.setuptools.packages.find]
where = ["src"]
