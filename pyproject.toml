[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name            = "pyinvoice"
description     = "cli script to generate PDF invoices from custom XML files"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE.txt"]
requires-python = ">= 3.9"
dynamic         = ["version"]

authors = [
    {name = "Felix Schwarz", email = "felix.schwarz@oss.schwarz.eu"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "babel",
    "docopt-ng",
    "jinja2",
    "lxml",
    "packaging",
]

[project.optional-dependencies]
testing = [
    # >= 8.1: "consider_namespace_packages"
    "pytest >= 8.1",
]

[project.urls]
Homepage        = "https://github.com/FelixSchwarz/pyinvoice"
Code            = "https://github.com/FelixSchwarz/pyinvoice"
"Issue tracker" = "https://github.com/FelixSchwarz/pyinvoice/issues"

[project.scripts]
pyinvoice = "schwarz.pyinvoice.cli:cli_main"


[dependency-groups]
build = [
    "hatchling",
]
executable = [
    "pyinstaller",
]
quality = [
    # >= 0.4.7 for "prek update --freeze --cooldown-days"
    "prek >= 0.4.7",
    "ty",
    "types-lxml",
]


[tool.hatch.version]
path = "VERSION.txt"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/schwarz"]

[tool.hatch.build.targets.sdist]
# "pyproject.toml", "README.md" and "LICENSE.txt" are always included
include = [
    "/src",
    "/pytest.ini",
    "/VERSION.txt",
]


[tool.uv]
exclude-newer = "7 days"


[tool.ruff]
line-length = 110
src = ["src"]


[tool.ruff.lint]
ignore = [
    # F405 "… may be undefined, or defined from star imports: …"
    #    Sometimes star imports are perfectly fine IMHO.
    "F403",
    "F405",
    # E731: "Do not assign a `lambda` expression, use a `def`"
    #    I think assigning to lambda expressions is ok.
    "E731",
    # UP031: "Use format specifiers instead of percent format"
    #    Style only, "%" formatting is not deprecated.
    "UP031",
]

select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pyupgrade: syntax which is obsolete for the minimum Python version
    "UP",

    # Special rule code to enforce that your noqa directives are "valid", in that
    # the violations they say they ignore are actually being triggered on that line
    # (and thus suppressed).
    # replaces basically "yesqa"
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# standalone script (shared with other projects) which might be run with any
# Python version so it needs its own version check
"tools/update-workflow-actions.py" = ["UP036"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["schwarz.pyinvoice"]
combine-as-imports = true
